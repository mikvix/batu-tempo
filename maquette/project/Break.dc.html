<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Exercice — Break et reprise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4F1EA;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141216; color: #F4F1EA; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 52px 20px 0; display: flex; align-items: center; gap: 12px">
    <a href="Exercices.dc.html" aria-label="Retour aux exercices" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #35303D; background: #1E1B22; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0">
      <div style="font-family: Syne, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">Break &amp; reprise</div>
      <div style="font-size: 13px; color: #A8A2B0">Samba Reggae · 96 BPM · Caixa</div>
    </div>
    <div style="height: 36px; padding: 0 12px; border-radius: 12px; background: #1E1B22; border: 1px solid #35303D; font-size: 13px; font-weight: 700; display: flex; align-items: center; flex: 0 0 auto">{{barLabel}}</div>
  </div>

  <div style="margin: 20px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em">
      <span style="color: #F2B134">Groove · 8</span>
      <span style="color: #FF7A5C">Break · 2</span>
      <span style="color: #3ECFA6">Reprise · 8</span>
    </div>
    <div style="position: relative; height: 14px">
      <div style="position: absolute; left: 0; right: 0; top: 3px; height: 8px; display: flex; gap: 2px">
        <span style="flex: 8 1 0; height: 8px; border-radius: 4px 0 0 4px; background: #F2B134"></span>
        <span style="flex: 2 1 0; height: 8px; background: #FF7A5C"></span>
        <span style="flex: 8 1 0; height: 8px; border-radius: 0 4px 4px 0; background: #3ECFA6"></span>
      </div>
      <div style="{{headStyle}}"></div>
    </div>
  </div>

  <div style="margin: 24px 20px 0; padding: 28px 20px 24px; border-radius: 24px; background: #1E1B22; border: 1px solid #2A2630; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <div style="{{phaseStyle}}">{{phase}}</div>
    <div style="{{bigStyle}}">{{big}}</div>
    <div style="font-size: 15px; font-weight: 600; color: #A8A2B0; text-align: center">{{hint}}</div>
    <div style="display: flex; gap: 12px; padding-top: 6px">
      <sc-for list="{{beats}}" as="b" hint-placeholder-count="4">
        <div style="{{b.style}}">{{b.n}}</div>
      </sc-for>
    </div>
  </div>

  <div style="margin: 18px 20px 0; padding: 14px 16px; border-radius: 18px; background: #1E1B22; border: 1px solid #2A2630; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #A8A2B0">Le break à jouer</div>
      <div style="font-size: 12px; color: #FF7A5C; font-weight: 700">Surdos + caixa</div>
    </div>
    <div style="display: flex; gap: 8px">
      <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 11px; color: #A8A2B0">Mesure 1</div>
        <div style="display: flex; gap: 3px">
          <span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #FF7A5C"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #FF7A5C"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span>
          <span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #FF7A5C; margin-left: 4px"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #FF7A5C"></span>
          <span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630; margin-left: 4px"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #FF7A5C"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #FF7A5C"></span>
          <span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630; margin-left: 4px"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #FF7A5C"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span>
        </div>
      </div>
    </div>
    <div style="display: flex; gap: 8px">
      <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 11px; color: #A8A2B0">Mesure 2 · silence puis reprise sur le 1</div>
        <div style="display: flex; gap: 3px">
          <span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #FF7A5C"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span>
          <span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630; margin-left: 4px"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span>
          <span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630; margin-left: 4px"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span>
          <span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630; margin-left: 4px"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #2A2630"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #3ECFA6"></span><span style="flex: 1 1 0; height: 26px; border-radius: 5px; background: #3ECFA6"></span>
        </div>
      </div>
    </div>
  </div>

  <div style="margin: 16px 20px 0; display: flex; gap: 8px; overflow-x: auto">
    <button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid #35303D; background: #1E1B22; color: #F4F1EA; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; flex: 0 0 auto">8 mesures de groove</button>
    <button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid #35303D; background: #1E1B22; color: #F4F1EA; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; flex: 0 0 auto">Break 2 mesures</button>
    <button aria-pressed="false" style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid #35303D; background: #1E1B22; color: #A8A2B0; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; flex: 0 0 auto; display: flex; align-items: center; gap: 6px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="m15 15 6 6"></path><path d="m4 4 5 5"></path></svg>
      Break surprise
    </button>
  </div>

  <div style="flex: 1 1 auto"></div>

  <div style="padding: 0 20px 28px; display: flex; align-items: center; gap: 12px">
    <button onClick="{{reset}}" style="height: 56px; padding: 0 16px; border-radius: 16px; border: 1px solid #35303D; background: #1E1B22; color: #F4F1EA; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1 1 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 3v6h6"></path></svg>
      Recommencer
    </button>
    <button aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="{{playStyle}}">
      <sc-if value="{{playing}}" hint-placeholder-val="{{false}}">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
      </sc-if>
      <sc-if value="{{stopped}}" hint-placeholder-val="{{true}}">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
      </sc-if>
    </button>
    <button style="height: 56px; padding: 0 16px; border-radius: 16px; border: 1px solid #35303D; background: #1E1B22; color: #F4F1EA; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1 1 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8z"></path><path d="M19 4v16"></path></svg>
      Suivant
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: false, beat: 0 };
    this.timer = null;
    this.bpm = 96;
    this.grooveBars = 8;
    this.breakBars = 2;
    this.repriseBars = 8;
  }
  componentDidMount() { this.sync(); }
  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
  sync() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (!this.state.playing) return;
    var total = (this.grooveBars + this.breakBars + this.repriseBars) * 4;
    this.timer = setInterval(() => {
      this.setState({ beat: (this.state.beat + 1) % total });
    }, 60000 / this.bpm);
  }
  renderVals() {
    var s = this.state;
    var totalBars = this.grooveBars + this.breakBars + this.repriseBars;
    var bar = Math.floor(s.beat / 4);
    var beatInBar = s.beat % 4;
    var phase, color, big, hint;
    if (bar < this.grooveBars) {
      phase = 'Groove'; color = '#F2B134';
      var left = this.grooveBars - bar;
      big = String(left);
      hint = left === 1 ? 'Break à la prochaine mesure' : 'mesures avant le break';
    } else if (bar < this.grooveBars + this.breakBars) {
      phase = 'Break'; color = '#FF7A5C';
      var left2 = this.grooveBars + this.breakBars - bar;
      big = String(left2);
      hint = left2 === 1 ? 'Reprise sur le 1 !' : 'mesures avant la reprise';
    } else {
      phase = 'Reprise'; color = '#3ECFA6';
      var left3 = totalBars - bar;
      big = String(left3);
      hint = 'Tiens le tempo du groupe';
    }
    if (!s.playing && s.beat === 0) { big = String(this.grooveBars); hint = 'Appuie sur lecture pour commencer'; }
    var beats = [];
    for (var i = 0; i < 4; i++) {
      var active = s.playing && beatInBar === i;
      beats.push({
        n: String(i + 1),
        style: 'width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: Syne, sans-serif; font-weight: 800; font-size: 16px; background: ' + (active ? color : '#2A2630') + '; color: ' + (active ? '#141216' : '#A8A2B0') + ';' + (active ? ' transform: scale(1.12);' : '')
      });
    }
    var pct = (s.beat / (totalBars * 4)) * 100;
    return {
      playing: s.playing,
      stopped: !s.playing,
      playLabel: s.playing ? 'Pause' : 'Lancer l’exercice',
      barLabel: 'Mesure ' + (bar + 1) + ' / ' + totalBars,
      phase: phase.toUpperCase(),
      phaseStyle: 'height: 26px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; background: ' + color + '; color: #141216;',
      big: big,
      bigStyle: 'font-family: Syne, sans-serif; font-weight: 800; font-size: 128px; line-height: 0.9; letter-spacing: -0.04em; color: ' + color + ';',
      hint: hint,
      beats: beats,
      headStyle: 'position: absolute; top: 0; width: 4px; height: 14px; border-radius: 2px; background: #F4F1EA; left: calc(' + pct.toFixed(2) + '% - 2px);',
      playStyle: 'width: 76px; height: 76px; border-radius: 50%; border: none; background: ' + color + '; color: #141216; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.4);',
      togglePlay: () => { this.setState({ playing: !this.state.playing }, () => this.sync()); },
      reset: () => { this.setState({ playing: false, beat: 0 }, () => this.sync()); }
    };
  }
}
</script>
</body>
</html>
